name: Collect race charts

"on":
  schedule:
    - cron: "17 6,18 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Discover only (requires SCRAPER_ENABLED=true for network access)
        type: boolean
        required: true
        default: true
      track:
        description: Track code for the single-race manual test (for example CD)
        type: string
        required: true
      date:
        description: Racing date for the manual test (YYYY-MM-DD)
        type: string
        required: true
      race:
        description: Only this race will be processed (1-99)
        type: string
        required: true
      listing_url:
        description: Explicit published listing URL (requires track and date)
        type: string

permissions:
  contents: read

concurrency:
  group: equibase-chart-collection
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET || 'race-charts' }}
      SCRAPER_ENABLED: ${{ vars.SCRAPER_ENABLED || 'false' }}
      LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '7' }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
      REQUEST_DELAY_SECONDS: ${{ vars.REQUEST_DELAY_SECONDS || '2' }}
      REQUEST_TIMEOUT_SECONDS: ${{ vars.REQUEST_TIMEOUT_SECONDS || '30' }}
      MAX_RETRIES: ${{ vars.MAX_RETRIES || '3' }}
      MAX_CHARTS_PER_RUN: ${{ vars.MAX_CHARTS_PER_RUN || '25' }}
      MAX_REQUESTS_PER_RUN: ${{ vars.MAX_REQUESTS_PER_RUN || '150' }}
      MAX_RETRY_WAIT_SECONDS: ${{ vars.MAX_RETRY_WAIT_SECONDS || '300' }}
      MAX_PDF_BYTES: ${{ vars.MAX_PDF_BYTES || '20000000' }}
      USER_AGENT: ${{ vars.USER_AGENT || 'equibase-scraper/0.1.0 (+https://github.com/ryan-lorentzen/equibase-scraper)' }}
      CHART_INDEX_URL: ${{ vars.CHART_INDEX_URL || 'https://tvg.equibase.com/static/chart/pdf/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install .
      - name: Run conservative collection
        env:
          INPUT_TRACK: ${{ inputs.track }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_RACE: ${{ inputs.race }}
          INPUT_LISTING_URL: ${{ inputs.listing_url }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys
          from datetime import date

          from equibase_scraper.discovery import card_from_url

          def manual_arguments() -> list[str]:
              track = os.environ.get("INPUT_TRACK", "").strip().upper()
              date_text = os.environ.get("INPUT_DATE", "").strip()
              race = os.environ.get("INPUT_RACE", "").strip()
              if not all((track, date_text, race)):
                  raise ValueError("Manual runs require track, date, and race.")
              if not re.fullmatch(r"[A-Z0-9]{1,6}", track):
                  raise ValueError("track must contain 1-6 ASCII letters or digits.")
              if not re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}", date_text):
                  raise ValueError("date must use YYYY-MM-DD.")
              try:
                  race_date = date.fromisoformat(date_text)
              except ValueError:
                  raise ValueError("date must be a valid calendar date.") from None
              if not re.fullmatch(r"[0-9]{1,2}", race) or not 1 <= int(race) <= 99:
                  raise ValueError("race must be an integer from 1 to 99.")
              dry_run = os.environ.get("INPUT_DRY_RUN", "").strip().lower() or "true"
              if dry_run not in {"true", "false"}:
                  raise ValueError("dry_run must be true or false.")
              args = ["--track", track, "--date", date_text, "--race", str(int(race))]
              listing_url = os.environ.get("INPUT_LISTING_URL", "").strip()
              if listing_url:
                  try:
                      card = card_from_url(listing_url)
                  except ValueError:
                      raise ValueError(
                          "listing_url must be an approved HTTPS Equibase card listing."
                      ) from None
                  if card.track.code != track or card.race_date != race_date:
                      raise ValueError("listing_url must match the requested track and date.")
                  args.extend(["--listing-url", listing_url])
              if dry_run == "true":
                  args.append("--dry-run")
              return args

          event = os.environ.get("GITHUB_EVENT_NAME")
          if event == "workflow_dispatch":
              try:
                  args = manual_arguments()
              except ValueError as error:
                  print(f"::error::Invalid manual inputs: {error}", file=sys.stderr)
                  raise SystemExit(2)
          elif event == "schedule":
              # Scheduled collection retains the normal configured recent-date mode.
              args = []
          else:
              print("::error::Unsupported workflow event.", file=sys.stderr)
              raise SystemExit(2)
          result = subprocess.run(
              [sys.executable, "-m", "equibase_scraper.main", *args], check=False
          )
          raise SystemExit(result.returncode)
          PY
      - name: Action summary
        if: always()
        shell: bash
        run: |
          printf '## Equibase scraper\n\nJob status: %s\n\nSCRAPER_ENABLED: `%s`\n\nSee the run logs for counters and failed source URLs.\n' \
            '${{ job.status }}' "$SCRAPER_ENABLED" >> "$GITHUB_STEP_SUMMARY"
