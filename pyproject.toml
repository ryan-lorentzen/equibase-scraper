[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "equibase-scraper"
version = "0.1.0"
description = "Conservative discovery and extraction of official Equibase race charts"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<0.29",
  "beautifulsoup4>=4.12,<5",
  "pymupdf>=1.25,<2",
  "supabase>=2.15,<3",
  "python-dotenv>=1.0,<2",
  "pydantic>=2.10,<3",
  "tzdata>=2025.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10", "ruff>=0.11,<1", "PyYAML>=6,<7", "pglast>=7,<8",
  "actionlint-py>=1.7.12.25,<2",
]

[project.scripts]
equibase-scraper = "equibase_scraper.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
